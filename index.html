<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерен Калкулатор</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome за икони -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Персонализирано сияние и ефекти за бутоните */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .calc-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .calc-btn:active, .calc-btn.active-key {
            transform: scale(0.92);
        }

        .calc-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
        }

        .calc-btn:active::after {
            transform: translate(-50%, -50%) scale(2);
            opacity: 1;
            transition: 0s;
        }

        /* Скриване на scrollbar за историята */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Фонови светлинни петна -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Главен контейнер на калкулатора -->
    <div class="relative w-full max-w-sm glass-panel rounded-3xl p-6 shadow-2xl border border-slate-700/50 flex flex-col justify-between z-10 transition-all">
        
        <!-- Горна лента с заглавие и бутони -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
            </div>
            <div class="flex items-center gap-3">
                <button id="soundToggleBtn" class="text-slate-400 hover:text-indigo-400 transition-colors p-1.5 rounded-lg hover:bg-slate-800/50" title="Звуков ефект">
                    <i class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <button id="historyToggleBtn" class="text-slate-400 hover:text-indigo-400 transition-colors p-1.5 rounded-lg hover:bg-slate-800/50" title="История на изчисленията">
                    <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Екран за изчисления -->
        <div class="bg-slate-900/80 rounded-2xl p-4 mb-5 border border-slate-800 flex flex-col justify-end items-end h-32 overflow-hidden shadow-inner relative">
            <!-- Предишно уравнение / операция -->
            <div id="previousOperand" class="text-slate-400 text-sm font-medium tracking-wide h-6 overflow-hidden text-ellipsis whitespace-nowrap"></div>
            <!-- Текущо въведено число / Резултат -->
            <div id="currentOperand" class="text-3xl sm:text-4xl font-semibold tracking-tight text-white mt-1 overflow-x-auto no-scrollbar max-w-full text-right">
                0
            </div>
        </div>

        <!-- Мрежа с бутони (Grid) -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Ред 1 -->
            <button data-action="clear" class="calc-btn bg-slate-800/90 hover:bg-slate-700/90 text-red-400 font-semibold p-4 rounded-2xl text-lg shadow-md border border-slate-700/40">AC</button>
            <button data-action="delete" class="calc-btn bg-slate-800/90 hover:bg-slate-700/90 text-indigo-400 font-semibold p-4 rounded-2xl text-lg shadow-md border border-slate-700/40" title="Заден знак (Backspace)">
                <i class="fa-solid fa-backspace"></i>
            </button>
            <button data-action="percent" class="calc-btn bg-slate-800/90 hover:bg-slate-700/90 text-indigo-400 font-semibold p-4 rounded-2xl text-lg shadow-md border border-slate-700/40">%</button>
            <button data-operation="/" class="calc-btn bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-4 rounded-2xl text-xl shadow-lg shadow-indigo-600/30">÷</button>

            <!-- Ред 2 -->
            <button data-number="7" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">7</button>
            <button data-number="8" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">8</button>
            <button data-number="9" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">9</button>
            <button data-operation="*" class="calc-btn bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-4 rounded-2xl text-xl shadow-lg shadow-indigo-600/30">×</button>

            <!-- Ред 3 -->
            <button data-number="4" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">4</button>
            <button data-number="5" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">5</button>
            <button data-number="6" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">6</button>
            <button data-operation="-" class="calc-btn bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-4 rounded-2xl text-xl shadow-lg shadow-indigo-600/30">−</button>

            <!-- Ред 4 -->
            <button data-number="1" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">1</button>
            <button data-number="2" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">2</button>
            <button data-number="3" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">3</button>
            <button data-operation="+" class="calc-btn bg-indigo-600 hover:bg-indigo-500 text-white font-semibold p-4 rounded-2xl text-xl shadow-lg shadow-indigo-600/30">+</button>

            <!-- Ред 5 -->
            <button data-action="toggle-sign" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-300 font-medium p-4 rounded-2xl text-lg shadow-sm border border-slate-700/30">+/−</button>
            <button data-number="0" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-medium p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">0</button>
            <button data-action="decimal" class="calc-btn bg-slate-800/50 hover:bg-slate-700/70 text-slate-100 font-semibold p-4 rounded-2xl text-xl shadow-sm border border-slate-700/30">.</button>
            <button data-action="equals" class="calc-btn bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-4 rounded-2xl text-xl shadow-lg shadow-cyan-500/30">=</button>
        </div>

        <!-- Текст за авторство -->
        <div class="mt-4 pt-3 border-t border-slate-800/60 text-center">
            <p class="text-xs text-slate-400 font-medium tracking-wide flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-code text-indigo-400 text-[10px]"></i>
                създадено от <span class="text-indigo-300 font-semibold">Красимир</span> за <span class="text-cyan-400 font-semibold">3 минути и 32 секунди</span>
            </p>
        </div>

        <!-- Страничен панел с историята -->
        <div id="historyDrawer" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md rounded-3xl p-6 flex flex-col justify-between transition-all duration-300 transform translate-x-full opacity-0 pointer-events-none z-20 border border-slate-700/60">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                    <h3 class="font-semibold text-lg text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> История
                    </h3>
                    <button id="closeHistoryBtn" class="text-slate-400 hover:text-white p-1 rounded-lg">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <!-- Списък с история -->
                <div id="historyList" class="mt-4 max-h-[280px] overflow-y-auto space-y-3 no-scrollbar pr-1">
                    <p class="text-slate-500 text-center text-sm py-8">Няма записани изчисления.</p>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <button id="clearHistoryBtn" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl font-medium text-sm transition-colors flex items-center justify-center gap-2">
                    <i class="fa-regular fa-trash-can"></i> Изчисти историята
                </button>
            </div>
        </div>

    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.soundEnabled = true;
                this.history = JSON.parse(localStorage.getItem('calc_history') || '[]');
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
                this.updateDisplay();
            }

            delete() {
                if (this.shouldResetScreen) return;
                if (this.currentOperand === '0') return;
                
                if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else if (this.shouldResetScreen) {
                    this.currentOperand = number.toString();
                    this.shouldResetScreen = false;
                } else {
                    // Ограничаваме въвеждането до 12 цифри за по-добра визия
                    if (this.currentOperand.replace('.', '').length >= 12) return;
                    this.currentOperand += number.toString();
                }
                this.updateDisplay();
            }

            toggleSign() {
                if (this.currentOperand === '0') return;
                this.currentOperand = (parseFloat(this.currentOperand) * -1).toString();
                this.updateDisplay();
            }

            computePercent() {
                if (this.currentOperand === '0') return;
                const current = parseFloat(this.currentOperand);
                this.currentOperand = (current / 100).toString();
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                
                if (this.previousOperand !== '') {
                    this.compute();
                }

                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        if (current === 0) {
                            this.showError("Не може да делите на 0");
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // Закръгляне за избягване на грешки от сорта на 0.1 + 0.2 = 0.30000000000000004
                const result = Math.round(computation * 1e10) / 1e10;
                
                // Добавяне към историята
                const record = {
                    expression: `${this.formatDisplayNumber(prev)} ${this.getSymbol(this.operation)} ${this.formatDisplayNumber(current)}`,
                    result: result.toString()
                };
                this.addHistory(record);

                this.currentOperand = result.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            getSymbol(op) {
                switch(op) {
                    case '*': return '×';
                    case '/': return '÷';
                    case '-': return '−';
                    default: return op;
                }
            }

            showError(msg) {
                this.currentOperand = 'Грешка';
                this.previousOperand = msg;
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            formatDisplayNumber(numberStr) {
                if (!numberStr || numberStr === 'Грешка') return numberStr;
                
                const stringNumber = numberStr.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];

                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('bg-BG', { maximumFractionDigits: 0 });
                }

                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                if (this.currentOperand === 'Грешка') {
                    this.currentOperandElement.innerText = 'Грешка';
                } else {
                    this.currentOperandElement.innerText = this.formatDisplayNumber(this.currentOperand) || '0';
                }

                if (this.operation != null) {
                    this.previousOperandElement.innerText = 
                        `${this.formatDisplayNumber(this.previousOperand)} ${this.getSymbol(this.operation)}`;
                } else {
                    this.previousOperandElement.innerText = this.previousOperand;
                }
            }

            addHistory(record) {
                this.history.unshift(record);
                if (this.history.length > 20) this.history.pop(); // Пазим до 20 записа
                localStorage.setItem('calc_history', JSON.stringify(this.history));
                this.renderHistory();
            }

            renderHistory() {
                const historyList = document.getElementById('historyList');
                if (this.history.length === 0) {
                    historyList.innerHTML = `<p class="text-slate-500 text-center text-sm py-8">Няма записани изчисления.</p>`;
                    return;
                }

                historyList.innerHTML = this.history.map((item, index) => `
                    <div class="bg-slate-800/60 hover:bg-slate-800 p-3 rounded-xl cursor-pointer transition-colors group border border-slate-700/30 history-item" data-index="${index}">
                        <div class="text-xs text-slate-400 text-right group-hover:text-indigo-300 transition-colors">${item.expression} =</div>
                        <div class="text-lg font-semibold text-slate-100 text-right">${this.formatDisplayNumber(item.result)}</div>
                    </div>
                `).join('');

                // При клик върху запис от историята - го зарежда в калкулатора
                document.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = el.getAttribute('data-index');
                        this.currentOperand = this.history[idx].result;
                        this.shouldResetScreen = true;
                        this.updateDisplay();
                        toggleHistory(false);
                    });
                });
            }

            clearHistory() {
                this.history = [];
                localStorage.removeItem('calc_history');
                this.renderHistory();
            }
        }

        // Синтезиране на дискретен клик звук с Web Audio API (без външни файлове)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound(enabled) {
            if (!enabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {
                // Игнорираме аудио ограничения на браузъра
            }
        }

        // Инициализация
        const previousOperandElement = document.getElementById('previousOperand');
        const currentOperandElement = document.getElementById('currentOperand');
        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // Бутони и събития
        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                playClickSound(calculator.soundEnabled);
                calculator.appendNumber(button.getAttribute('data-number'));
            });
        });

        document.querySelectorAll('[data-operation]').forEach(button => {
            button.addEventListener('click', () => {
                playClickSound(calculator.soundEnabled);
                calculator.chooseOperation(button.getAttribute('data-operation'));
            });
        });

        document.querySelectorAll('[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                playClickSound(calculator.soundEnabled);
                const action = button.getAttribute('data-action');
                switch(action) {
                    case 'clear':
                        calculator.clear();
                        break;
                    case 'delete':
                        calculator.delete();
                        break;
                    case 'percent':
                        calculator.computePercent();
                        break;
                    case 'toggle-sign':
                        calculator.toggleSign();
                        break;
                    case 'decimal':
                        calculator.appendNumber('.');
                        break;
                    case 'equals':
                        calculator.compute();
                        break;
                }
            });
        });

        // Клавиатурна поддръжка
        window.addEventListener('keydown', (e) => {
            let key = e.key;

            // Предотвратяване на скролиране при Enter или Space
            if (['/', '*', '-', '+', 'Enter', 'Backspace', 'Escape'].includes(key)) {
                e.preventDefault();
            }

            let btnToHighlight = null;

            if (key >= '0' && key <= '9') {
                calculator.appendNumber(key);
                btnToHighlight = document.querySelector(`[data-number="${key}"]`);
            } else if (key === '.') {
                calculator.appendNumber('.');
                btnToHighlight = document.querySelector('[data-action="decimal"]');
            } else if (key === '+') {
                calculator.chooseOperation('+');
                btnToHighlight = document.querySelector('[data-operation="+"]');
            } else if (key === '-') {
                calculator.chooseOperation('-');
                btnToHighlight = document.querySelector('[data-operation="-"]');
            } else if (key === '*') {
                calculator.chooseOperation('*');
                btnToHighlight = document.querySelector('[data-operation="*"]');
            } else if (key === '/') {
                calculator.chooseOperation('/');
                btnToHighlight = document.querySelector('[data-operation="/"]');
            } else if (key === '%' || key === '%') {
                calculator.computePercent();
                btnToHighlight = document.querySelector('[data-action="percent"]');
            } else if (key === 'Enter' || key === '=') {
                calculator.compute();
                btnToHighlight = document.querySelector('[data-action="equals"]');
            } else if (key === 'Backspace') {
                calculator.delete();
                btnToHighlight = document.querySelector('[data-action="delete"]');
            } else if (key === 'Escape') {
                calculator.clear();
                btnToHighlight = document.querySelector('[data-action="clear"]');
            }

            if (btnToHighlight) {
                playClickSound(calculator.soundEnabled);
                btnToHighlight.classList.add('active-key');
                setTimeout(() => btnToHighlight.classList.remove('active-key'), 150);
            }
        });

        // Управление на Историята
        const historyDrawer = document.getElementById('historyDrawer');
        const historyToggleBtn = document.getElementById('historyToggleBtn');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        function toggleHistory(show) {
            if (show) {
                calculator.renderHistory();
                historyDrawer.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            } else {
                historyDrawer.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            }
        }

        historyToggleBtn.addEventListener('click', () => toggleHistory(true));
        closeHistoryBtn.addEventListener('click', () => toggleHistory(false));
        clearHistoryBtn.addEventListener('click', () => calculator.clearHistory());

        // Превключване на звука
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        soundToggleBtn.addEventListener('click', () => {
            calculator.soundEnabled = !calculator.soundEnabled;
            soundToggleBtn.innerHTML = calculator.soundEnabled 
                ? '<i class="fa-solid fa-volume-high text-sm"></i>' 
                : '<i class="fa-solid fa-volume-xmark text-sm text-slate-500"></i>';
        });
    </script>
</body>
</html>
